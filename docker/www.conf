[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

request_terminate_timeout = 180s
catch_workers_output = yes
decorate_workers_output = no

; Pass all environment variables from container/Render to PHP worker processes
clear_env = no
