server {
    listen __PORT__;
    server_name _;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # Maximum file upload size for ROMANTIK JSON files
    client_max_body_size 25M;

    # Standard container logging to stdout and stderr
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Static Vite build assets with long-term caching
    location ~* ^/build/.*\.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Route all requests to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Health check endpoint for Render monitoring
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Forward PHP requests to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout extended to accommodate long-running external AI analysis (default 120s)
        fastcgi_connect_timeout 180s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Disallow access to hidden files and dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
